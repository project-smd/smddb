name: SmdKit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  Test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      # swiftly rather than setup-swift: it installs any toolchain swift.org has released, the
      # day it is released, so the pin here never waits on an action's version list.
      - uses: vapor/swiftly-action@v0.2
        with:
          toolchain: "6.4.0"
      # On Linux rather than macOS deliberately: the package has nothing Apple-only in it, and
      # the validator that will run here has to keep it that way.
      - name: Test
        run: swift test
        working-directory: SmdKit
